<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Movie</title>
</head>
<body>
    <h1>Add Movie</h1>
    <form method="POST">
        Original Title: <input type="text" name="original_title"><br>
        Budget: <input type="number" name="budget"><br>
        Popularity: <input type="number" step="0.1" name="popularity"><br>
        Release Date: <input type="text" name="release_date"><br>
        Revenue: <input type="number" name="revenue"><br>
        Title: <input type="text" name="title"><br>
        Vote Average: <input type="number" step="0.1" name="vote_average"><br>
        Vote Count: <input type="number" name="vote_count"><br>
        Overview: <input type="text" name="overview"><br>
        Director ID: <input type="number" name="director_id"><br>
        <input type="submit" value="Add Movie">
    </form>
    <br>
    <a href="{{ url_for('index') }}">Back To Home</a>
</body>
</html>
